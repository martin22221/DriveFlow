<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveFlow Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="hero">
        <nav class="navbar">
            <div class="logo">DriveFlow</div>
            <span class="badge">API Demo</span>
        </nav>

        <div class="hero-content">
            <h1>Find your next rental car</h1>
            <p>Live frontend demo connected to the ASP.NET Core Web API.</p>
                  
            <button id="loadCarsBtn">Load Cars</button>

            <div class="hero-stats">
                <span>🚗 6 Vehicles</span>
                <span>⭐ Premium Fleet</span>
                <span>🛡️ Secure Rentals</span>
            </div>

        </div>
    </header>

    <main class="container">
        <div class="section-title">
            <h2>Available Cars</h2>
            <p>Data is loaded with fetch from the backend API.</p>
        </div>
        <div class="toolbar">
            <p id="carsCount" class="cars-count"></p>


            <input type="text"
                   id="searchInput"
                   placeholder="Search by brand or model...">

            <select id="sortSelect">
                <option value="">Sort by</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
            </select>

        </div>


        <div id="cars" class="cars-grid"></div>
    </main>

    <footer>
        <p>DriveFlow © 2026</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
